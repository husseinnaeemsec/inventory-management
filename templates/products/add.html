{% extends 'base.html' %}
{% block content %}
<form method="post" action="{{request.path}}" enctype="multipart/form-data" class="max-w-7xl mx-auto mt-20" id="productForm">
    {% csrf_token %}
    <div class="flex items-center justify-between">
        <h1 class="text-2xl">اضافة منتج جديد</h1>
        <div class="flex items-center gap-5">
            <button type="button" class="flex p-3 px-5 rounded-full border bg-white gap-3">
                حفظ في المسودة
                <i class="fa-solid fa-file"></i>
            </button>
            <button type="submit" class="rounded-full p-3 px-5 bg-blue-500 text-white border gap-3 flex items-center">
                اضافة
                <i class="fa-solid fa-check"></i>
            </button>
        </div>
    </div>
    <div class="my-10">
        <div class="grid grid-cols-5 gap-5">
            <div class="lg:col-span-3 space-y-5">
                <!-- Product info -->
                <div class="border p-5 rounded-lg">
                    <h1 class="text-lg">معلومات المنتج</h1>
                    <div class="mt-5 space-y-3">
                        <label for="name" class="text-slate-500"> اسم المنتج </label>
                        <div class="relative z-0 flex items-center">
                            <input required type="text" name="name" id="name" placeholder="عطر نسائي"
                                class="w-full p-3 px-4 pr-8 bg-slate-100 rounded-md" />
                            <i
                                class="fa-solid fa-at absolute right-2 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                        </div>
                    </div>
                    <div class="mt-5 space-y-3">
                        <label for="description" class="text-slate-500"> وصف المنتج </label>
                        <textarea required name="description" id="description" rows="5"
                            class="w-full p-3 px-4 bg-slate-100 rounded-md"></textarea>
                    </div>
                </div>
                <!-- Pricing and stock -->
                <div class="border p-5 rounded-lg">
                    <h1 class="text-lg">التسعير والمخزون</h1>
                    <div class="grid lg:grid-cols-2 gap-3 mt-5">
                        <label for="price" class="text-slate-500">السعر</label>
                        <label for="quantity" class="text-slate-500">المخزون</label>
                        <div class="relative z-0 flex items-center">
                            <input required type="number" accept="number" name="price" id="price" class="w-full p-3 px-4 pr-8 flex items-center bg-slate-100 rounded-md" />
                            <i class="fa-solid fa-dollar-sign text-slate-400 absolute right-2"></i>
                        </div>
                        <div class="relative z-0 flex items-center">
                            <input required type="number" accept="number" name="quantity" id="quantity" class="w-full p-3 px-4 pr-8 flex items-center bg-slate-100 rounded-md" />
                            <i class="fa-solid fa-boxes text-slate-400 absolute right-2"></i>
                        </div>
                        <label for="price" class="text-slate-500">خصم</label>
                        <label for="quantity" class="text-slate-500">نوع الخصم</label>
                        <div class="relative z-0 flex items-center">
                            <input required type="number" accept="number" name="discount" id="discount" class="w-full p-3 px-4 pr-8 flex items-center bg-slate-100 rounded-md" />
                            <i class="fa-solid fa-percent text-slate-400 absolute right-2"></i>
                        </div>
                        <div class="relative z-0 bg-slate-100 rounded-md flex items-center">
                            <select name="discount_type" class="w-full p-3 px-4 bg-slate-100 rounded-md pr-8 " id="">
                                <option value="percentage"> نسبة  </option>
                                <option value="fixed"> ثابت  </option>
                            </select>
                            <i class="fa-solid fa-tag absolute right-2 text-slate-400"></i>
                        </div>
                        
                    </div>
                </div>
            </div>
            <div class="lg:col-span-2 space-y-5">
                <div class="border p-5 space-y-5 rounded-md">
                    <h1 class="text-lg">صور المنتج</h1>
                    <input type="file" id="imageUpload" class="hidden" multiple accept="image/*">
                    <label for="imageUpload" id="bigImageContainer"
                        class="cursor-pointer block w-full h-96 bg-slate-100 rounded-md border flex items-center justify-center overflow-hidden">
                        <i class="fa-solid fa-image text-slate-400 text-5xl"></i>
                    </label>
                    <div id="imageGrid" class="grid grid-cols-4 gap-5"></div>
                </div>
                <div class="border p-5 space-y-5 rounded-md">
                    <h1 class="text-lg"> التصنيف</h1>
                    <select required name="category" id="" class="p-2 px-4 bg-slate-100 rounded w-full">
                        
                        {% for category in categories  %}
                            <option value="{{category.id}}"> {{category.name}} </option>
                        {% endfor %}
                            
                    </select>
                </div>
            </div>
        </div>
    </div>
</form>

<script>
    document.getElementById('imageUpload').addEventListener('change', function (event) {
        const files = event.target.files;
        const imageGrid = document.getElementById('imageGrid');
        const bigImageContainer = document.getElementById('bigImageContainer');

        Array.from(files).forEach((file, index) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (e) {
                const imgContainer = document.createElement('div');
                imgContainer.className = "relative w-full h-24 rounded-md bg-slate-100 flex items-center justify-center overflow-hidden";

                const img = document.createElement('img');
                img.src = e.target.result;
                img.className = "w-full h-full object-cover";

                const removeBtn = document.createElement('button');
                removeBtn.innerHTML = "&times;";
                removeBtn.className = "absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center";
                removeBtn.onclick = function () {
                    imgContainer.remove();
                    if (bigImageContainer.firstChild.tagName === 'IMG' && bigImageContainer.firstChild.src === img.src) {
                        bigImageContainer.innerHTML = '<i class="fa-solid fa-image text-slate-400 text-5xl"></i>';
                    }
                };

                imgContainer.appendChild(img);
                imgContainer.appendChild(removeBtn);
                imageGrid.appendChild(imgContainer);

                // Set the last uploaded image as the big image
                bigImageContainer.innerHTML = '';
                const bigImg = document.createElement('img');
                bigImg.src = e.target.result;
                bigImg.className = "w-full h-full object-cover";
                bigImageContainer.appendChild(bigImg);
            };
        });
    });

    document.getElementById('productForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const formData = new FormData(this);
        const imageFiles = document.getElementById('imageUpload').files;

        for (let i = 0; i < imageFiles.length; i++) {
            formData.append('images', imageFiles[i]);
        }

        fetch(this.action, {
            method: 'POST',
            body: formData
        }).then(response => response.json())
            .then(data => console.log(data))
            .catch(error => console.error('Error:', error));
    });
</script>
{% endblock content %}
